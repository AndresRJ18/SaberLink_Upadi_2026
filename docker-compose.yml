services:
  backend:
    build: ./backend
    # No `ports:` — under Dokploy, Traefik already owns 80/443 on the host
    # and reaches containers over Docker's internal network using the
    # "Container Port" set in the service's Domains tab, not a published
    # host port. Publishing 8000 here would conflict the same way 80 did
    # for frontend. `expose` is documentation only, doesn't publish anything.
    expose:
      - "8000"
    volumes:
      # Persists ingest/embeddings/graph across container restarts — the
      # whole point of a real VPS over an ephemeral-disk PaaS.
      - backend_processed:/app/processed
      # The dataset itself never lives in the image or the git repo — copy
      # it onto the VPS once (e.g. scp -r data/raw/ vps:/opt/saberlink-data)
      # and point this at wherever you put it.
      - ${SABERLINK_DATA_DIR:-./data/raw}:/app/data_raw:ro
    environment:
      SABERLINK_DATA_ROOT: /app/data_raw
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # [PLUS] optional — the "Generar con IA" button falls back to the
      # template text if these are unset, nothing else depends on them.
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.amazon.nova-2-lite-v1:0}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_processed:
