# Solo para probar el stack completo en tu máquina, sin pasar por Dokploy.
# Dokploy usa docker-compose.yml tal cual (sin puertos publicados, porque su
# Traefik ya ocupa 80/443) — este archivo nunca se usa en producción, solo
# se activa si lo pasás explícitamente:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
services:
  backend:
    ports:
      - "8000:8000"
  frontend:
    ports:
      - "80:80"
